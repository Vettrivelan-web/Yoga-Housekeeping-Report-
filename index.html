<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Report V3.7 - S.No Integration</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e9ecef; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .location-box { background: #007bff; padding: 10px; border-radius: 6px; margin-bottom: 15px; color: white; text-align: center; }
        .location-box select { padding: 8px; border-radius: 4px; font-size: 16px; font-weight: bold; width: 150px; }
        h2 { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-top: 0; }
        .sub-header { text-align: center; color: #d63384; font-weight: bold; margin-bottom: 10px; font-size: 18px; }
        
        .btn { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 5px 0; color: white; font-weight: bold; width: 100%; text-transform: uppercase; }
        .btn-orange { background: #fd7e14; width: auto; float: right; font-size: 11px; padding: 5px 10px; }
        .btn-gen { background: #28a745; margin-top: 20px; font-size: 16px; }
        .btn-whatsapp { background: #25D366; width: 48%; }
        .btn-copy { background: #007bff; width: 48%; }
        .btn-red { background: #dc3545; }

        .sup-box { background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        .sup-box select { width: 100%; padding: 8px; border-radius: 4px; }

        .category-title { background: #444; color: #fff; padding: 10px; font-weight: bold; border-radius: 4px; margin-top: 20px; display: flex; justify-content: space-between; }
        .worker-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .worker-item { background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc; display: flex; align-items: center; cursor: pointer; font-size: 13px; min-height: 40px; }
        .worker-item.is-absent { background-color: #ffeaea; border: 1px solid #dc3545; color: #dc3545; font-weight: bold; }
        .worker-item input { margin-right: 8px; pointer-events: none; }
        .sno-badge { font-weight: bold; color: #666; margin-right: 5px; min-width: 20px; display: inline-block; }

        .report-section { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .report-title { font-weight: bold; color: #333; margin-bottom: 10px; display: block; border-left: 4px solid #28a745; padding-left: 10px; text-transform: uppercase; font-size: 12px; }
        textarea { width: 100%; height: 180px; margin: 10px 0; padding: 10px; font-family: 'Courier New', Courier, monospace; border: 1px solid #ccc; font-size: 13px; box-sizing: border-box; white-space: pre-wrap; }
        .button-row { display: flex; justify-content: space-between; }
        
        .hidden { display: none; }
        .edit-row { display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="location-box">
        <label>Place:</label>
        <select id="locationSelect" onchange="switchLocation()">
            <option value="BH2">BH-2</option>
            <option value="OMV">Omv Hostel</option>
            <option value="GH">Girls Hostel</option>
        </select>
    </div>

    <button class="btn btn-orange" onclick="toggleEditView()" id="editToggleBtn">Manage Names</button>
    <h2>Attendance</h2>
    <div class="sub-header" id="placeHeader">Boys hostel-II</div>

    <div id="attendanceView">
        <div class="sup-box">
            <label>Supervisor (Prepared by):</label>
            <select id="supervisorSelect"></select>
        </div>

        <div style="text-align: center; color: #666; font-size: 11px; font-weight: bold;">SELECT NAMES TO MARK ABSENT</div>
        <div id="listContainer"></div>

        <button class="btn btn-gen" onclick="generateAllReports()">Generate All Reports</button>

        <div id="resultArea" class="hidden">
            <!-- 1. HK ABSTRACT -->
            <div class="report-section">
                <span class="report-title">1. Daily Abstract (Short)</span>
                <textarea id="outputAbstract"></textarea>
                <div class="button-row"><button class="btn btn-copy" onclick="copyText('outputAbstract')">Copy Abstract</button><button class="btn btn-whatsapp" onclick="shareWA('outputAbstract')">WA Share</button></div>
            </div>

            <!-- 2. DETAILED REPORT -->
            <div class="report-section">
                <span class="report-title">2. Detailed Report (Names with S.No)</span>
                <textarea id="outputDetailed" style="height: 350px;"></textarea>
                <div class="button-row"><button class="btn btn-copy" onclick="copyText('outputDetailed')">Copy Detailed</button><button class="btn btn-whatsapp" onclick="shareWA('outputDetailed')">WA Share</button></div>
            </div>

            <!-- 3. KOVIL REPORT -->
            <div class="report-section">
                <span class="report-title">3. Bajanai Kovil Report</span>
                <textarea id="outputKovil"></textarea>
                <div class="button-row"><button class="btn btn-copy" onclick="copyText('outputKovil')">Copy Kovil Report</button><button class="btn btn-whatsapp" onclick="shareWA('outputKovil')">WA Share</button></div>
            </div>
        </div>
    </div>

    <div id="editView" class="hidden">
        <h3 style="text-align:center;">Manage Names</h3>
        <div style="text-align:center; margin-bottom:15px;">
            <button class="btn btn-gen" style="width:45%" onclick="toggleEditView()">Save & Back</button>
            <button class="btn btn-red" style="width:45%" onclick="resetData()">Reset Data</button>
        </div>
        <div id="editListContainer"></div>
    </div>
</div>

<script>
    const kovilSpecificNames = ["P.selvi", "Muthulakshmi", "P.vasanthi"];

    const defaultConfig = {
        BH2: { name: "BH-2", sStr: 30, scStr: 24, hkStr: 1, names: { supervisors: ["M.kirubakanni", "S.selvi"], sweepers: ["Akila", "Kannagi", "Durga", "Radha", "Selvi", "Ponni", "Jaya", "V.Lakshmi", "Vali", "Malliga", "Virammal", "Devki", "Kamala", "Maniyamma", "Padhmavathy", "Panjala", "Gowri", "Shobana", "Shanthi"], scavengers: ["Kasturi", "Ponnammal", "Lakshmi.N", "Lakshmi", "Sushila", "Chitra", "Muthulakshmi", "Rajakumari", "Selvi", "Vasanthi.P", "Lakshmi.M", "Muniyammal", "Mahalingam", "Malar", "Selvi.p", "Alamelu", "Yoestha", "E.Lashmi", "P.Selvi"] } },
        OMV: { name: "Omv Hostel", sStr: 18, scStr: 18, hkStr: 1, names: { supervisors: ["Andavar"], sweepers: ["A.Bavani", "Jumuna Rani", "M.Thenmohizi", "A.Vasantha", "S.Sathya", "R.Jayabharathi", "S.Devi", "P.Rajakani", "K.Vimala", "Dhanalakshmi", "S.uma", "Pachaiyammal", "P.Rukumani", "A.Kumari", "A.Nalini", "E.Poongavanam", "T.Selvi", "S.Ramadevi"], scavengers: ["S.Ranganayaki", "R.Sundarambal", "K.Chithra", "J.Mohana", "B.Geetha", "R.Vettriselvi", "C.Panchavarnam", "S.Rose", "Poonamdevi", "K.Gandhi Mathi"] } },
        GH: { name: "Girls Hostel", sStr: 19, scStr: 11, hkStr: 1, names: { supervisors: ["Selvi"], sweepers: ["Manjula", "Gandhi", "Ramani", "Jaya", "Nermathi", "Kanikaivel", "Mohanammal", "Madhavi", "Muniyammal", "Chandra", "Sundari", "Parameshwari"], scavengers: ["Dhivya", "Ranjitham", "Sarala", "Usha", "Savithri", "Revathi", "Vijaya", "Vasantha", "Devi", "Poongavanam (Night shift)", "Muthulakshmi (Night shift)"] } }
    };

    let currentLoc = "BH2", appData = {}, selections = { absent: {} };

    function switchLocation() {
        currentLoc = document.getElementById('locationSelect').value;
        loadData();
        document.getElementById('placeHeader').innerText = defaultConfig[currentLoc].name;
        selections = { absent: {} };
        renderAttendance();
    }

    function loadData() {
        const key = "v37_data_" + currentLoc;
        const saved = localStorage.getItem(key);
        if (saved) appData = JSON.parse(saved);
        else {
            appData = {};
            for (let cat in defaultConfig[currentLoc].names) 
                appData[cat] = defaultConfig[currentLoc].names[cat].map(n => ({ name: n, hidden: false }));
        }
        const sel = document.getElementById('supervisorSelect');
        sel.innerHTML = '';
        appData.supervisors.forEach(s => { if(!s.hidden) sel.innerHTML += `<option value="${s.name}">${s.name}</option>`; });
    }

    function renderAttendance() {
        const cont = document.getElementById('listContainer'); cont.innerHTML = '';
        ['supervisors', 'sweepers', 'scavengers'].forEach(cat => {
            const str = (cat === 'supervisors') ? defaultConfig[currentLoc].hkStr : (cat === 'sweepers' ? defaultConfig[currentLoc].sStr : defaultConfig[currentLoc].scStr);
            let html = `<div class="category-title"><span>${cat.toUpperCase()}</span> <span>Str: ${str}</span></div><div class="worker-list">`;
            
            let visibleIdx = 1;
            appData[cat].forEach((item, idx) => {
                if(item.hidden) return;
                const key = `${cat}-${idx}`;
                const isA = selections.absent[key] ? 'is-absent' : '';
                html += `<div class="worker-item ${isA}" onclick="toggleAbsent('${cat}', ${idx})">
                            <input type="checkbox" ${isA ? 'checked' : ''}>
                            <span class="sno-badge">${visibleIdx}.</span> ${item.name}
                         </div>`;
                visibleIdx++;
            });
            cont.innerHTML += html + `</div>`;
        });
    }

    function toggleAbsent(cat, idx) {
        const key = `${cat}-${idx}`;
        selections.absent[key] = !selections.absent[key];
        renderAttendance();
    }

    function generateAllReports() {
        const date = new Date().toLocaleDateString('en-GB');
        const loc = defaultConfig[currentLoc];
        const supName = document.getElementById('supervisorSelect').value;
        
        let abstract = `Daily House keeping Report ${loc.name}\n${date}\n\n`;
        let detailed = `Daily H.K Attendance Report\nPlace: ${loc.name}\nDate: ${date}\n==========================\n`;
        
        const catMap = [
            {l: "Sweeper", k: "sweepers", s: loc.sStr}, 
            {l: "Scavenger", k: "scavengers", s: loc.scStr}, 
            {l: "Hk supervisor", k: "supervisors", s: loc.hkStr}
        ];

        let kovS = 0, kovSc = 0, kovPList = [], kovAList = [];

        catMap.forEach(c => {
            let pList = [], aList = [];
            let visCount = 0;

            appData[c.k].forEach((item, i) => {
                if(item.hidden) return;
                visCount++;
                const key = `${c.k}-${i}`;
                const isSpec = kovilSpecificNames.some(kn => item.name.toLowerCase().includes(kn.toLowerCase()));

                if(selections.absent[key]) {
                    aList.push(item.name);
                    if(isSpec) kovAList.push(item.name);
                } else {
                    pList.push(item.name);
                    if(isSpec) {
                        if(c.k === 'sweepers') kovS++;
                        if(c.k === 'scavengers') kovSc++;
                        kovPList.push(item.name);
                    }
                }
            });

            let vacant = c.s - visCount;

            abstract += `${c.l} Allowed Strength: ${c.s}\n${c.l} Present: ${pList.length.toString().padStart(2,'0')}\n${c.l} Absent: ${aList.length.toString().padStart(2,'0')}\n${c.l} Vacant: ${vacant.toString().padStart(2,'0')}\n\n`;

            detailed += `\n${c.k.toUpperCase()}\nTotal Strength: ${c.s}\nPresent: ${pList.length}\nAbsent: ${aList.length}\nVacant: ${vacant}\n`;
            detailed += `--- Present List ---\n${pList.map((n, idx) => (idx+1)+'. '+n).join('\n') || '(Nil)'}\n`;
            detailed += `--- Absent List ---\n${aList.map((n, idx) => (idx+1)+'. '+n).join('\n') || '(Nil)'}\n`;
            detailed += `--------------------------\n`;
        });

        detailed += `\nPrepared by: ${supName}`;

        let kovilReport = `Bajanai Kovil report\n\n${date}\nSweeper -${kovS.toString().padStart(2,'0')}\nScavenger-${kovSc.toString().padStart(2,'0')}\n${kovPList.map((n, i) => (i+1)+'. '+n).join('\n') || '(Nil)'}`;
        if(kovAList.length > 0) {
            kovilReport += `\n\n--- Absent ---\n${kovAList.map((n, i) => (i+1)+'. '+n).join('\n')}`;
        }

        document.getElementById('resultArea').classList.remove('hidden');
        document.getElementById('outputAbstract').value = abstract;
        document.getElementById('outputDetailed').value = detailed;
        document.getElementById('outputKovil').value = kovilReport;
        window.scrollTo(0, document.body.scrollHeight);
    }

    function toggleEditView() {
        const isEdit = document.getElementById('attendanceView').style.display === 'none';
        document.getElementById('attendanceView').style.display = isEdit ? 'block' : 'none';
        document.getElementById('editView').classList.toggle('hidden', isEdit);
        document.getElementById('editToggleBtn').innerText = isEdit ? 'Manage Names' : 'Back';
        if (!isEdit) renderEdit(); else loadData();
    }

    function renderEdit() {
        const cont = document.getElementById('editListContainer'); cont.innerHTML = '';
        ['supervisors', 'sweepers', 'scavengers'].forEach(cat => {
            let html = `<div class="category-title" style="background:#666;">${cat.toUpperCase()}</div>
            <div style="display:flex; gap:5px; margin:10px 0;"><input type="text" id="new-${cat}" style="flex:1; padding:8px;" placeholder="New Name"><button class="btn btn-blue" style="width:auto; margin:0;" onclick="addNew('${cat}')">Add</button></div>`;
            appData[cat].forEach((item, idx) => {
                html += `<div class="edit-row"><span style="${item.hidden ? 'color:#ccc; text-decoration:line-through;' : ''}">${idx+1}. ${item.name}</span>
                <div><button class="btn" style="width:auto; padding:5px 10px; margin:0; background:${item.hidden ? '#28a745' : '#ffc107'}; color:#000;" onclick="toggleHide('${cat}', ${idx})">${item.hidden ? 'Show' : 'Hide'}</button>
                <button class="btn btn-red" style="width:auto; padding:5px 10px; margin:0 0 0 5px;" onclick="delName('${cat}', ${idx})">Del</button></div></div>`;
            });
            cont.innerHTML += html;
        });
    }

    function addNew(cat) { const val = document.getElementById('new-'+cat).value.trim(); if(val) { appData[cat].push({name: val, hidden: false}); save(); renderEdit(); } }
    function toggleHide(cat, idx) { appData[cat][idx].hidden = !appData[cat][idx].hidden; save(); renderEdit(); }
    function delName(cat, idx) { if(confirm("Delete?")) { appData[cat].splice(idx,1); save(); renderEdit(); } }
    function save() { localStorage.setItem("v37_data_" + currentLoc, JSON.stringify(appData)); }
    function resetData() { if(confirm("Reset Everything?")) { localStorage.removeItem("v37_data_" + currentLoc); loadData(); renderEdit(); } }
    function copyText(id) { const el = document.getElementById(id); el.select(); document.execCommand('copy'); alert("Copied!"); }
    function shareWA(id) { window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(document.getElementById(id).value)}`); }

    switchLocation();
</script>
</body>
</html>
